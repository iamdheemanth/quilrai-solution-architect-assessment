[project]
name = "mcp-gateway"
version = "1.0.0"
description = "Security gateway (HTTP/JSON-RPC reverse proxy) for MCP servers, with a mock downstream"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "starlette>=1.10,<2",
    "uvicorn>=0.54",
    "httpx2>=2.16,<3",
    "pyjwt>=2.15,<3",
    "anyio>=4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
mcp-gateway = "mcp_gateway.__main__:main"
mock-mcp-server = "mock_mcp.server:main"
mint-token = "mcp_gateway.tokens:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway", "src/mock_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
