[project]
name = "llm-router"
version = "1.0.0"
description = "OpenAI-compatible LLM router with a SQLite token rate limiter and primary-to-secondary failover"
requires-python = ">=3.12"
dependencies = [
    "starlette>=1.10,<2",
    "uvicorn>=0.54",
    "httpx2>=2.16,<3",
    "anyio>=4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "openai>=3.46,<4",
]

[project.scripts]
llm-router = "llm_router.__main__:main"
mock-provider = "mock_providers.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_router", "src/mock_providers"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (default run includes them; keep under 60 s)"]
