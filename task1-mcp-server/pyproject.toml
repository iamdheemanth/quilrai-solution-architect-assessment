[project]
name = "customer-mcp"
version = "1.0.0"
description = "Customer service MCP server (stdio) exposing get_customer_record and trigger_refund"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.12,<3",
    "anyio>=4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
customer-mcp = "customer_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
