[project]
name = "llm-gateway"
version = "1.0.0"
description = "Streaming PII-redaction gateway for OpenAI-compatible LLM providers, with a mock provider"
requires-python = ">=3.12"
dependencies = [
    "starlette>=1.10,<2",
    "uvicorn>=0.54",
    "httpx2>=2.16,<3",
    "regex>=2026.1",
    "anyio>=4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "hypothesis>=6.150",
    "openai>=3.46,<4",
]

[project.scripts]
llm-gateway = "llm_gateway.__main__:main"
mock-llm = "mock_llm.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway", "src/mock_llm"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (default run includes them; keep under 60 s)"]
